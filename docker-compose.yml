services:
  bench:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
      - grow_data:/data
    environment:
      - TRAIN_SECONDS=${TRAIN_SECONDS:-28800}
      - THREADS=${THREADS:-3}
      - TARGET_CHARS=${TARGET_CHARS:-40000000}
      - REPORT_EVERY=${REPORT_EVERY:-900}
      - CKPT_EVERY=${CKPT_EVERY:-600}
      - DATA_DIR=/data
      - REPORT_URL=${REPORT_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    command: sh -c "pip install --no-cache-dir -q numpy torch --index-url https://download.pytorch.org/whl/cpu && exec python -u /app/train.py"
    stop_grace_period: 90s
    restart: on-failure:5

  factory:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
      - grow_data:/data
    environment:
      - TEACHER_BASE_URL=${TEACHER_BASE_URL:-https://aihubmix.com/v1}
      - TEACHER_API_KEY=${TEACHER_API_KEY:-}
      - TEACHER_MODEL=${TEACHER_MODEL:-qwen3.8-flash}
      - TEACHER_MAX_TOKENS=${TEACHER_MAX_TOKENS:-1400}
      - MAX_CALLS=${MAX_CALLS:-500}
      - FACTORY_SECONDS=${FACTORY_SECONDS:-7200}
      - REPORT_EVERY=${REPORT_EVERY:-600}
      - DATA_DIR=/data
      - REPORT_URL=${REPORT_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    command: sh -c "exec python -u /app/factory.py"
    stop_grace_period: 60s
    restart: on-failure:5

  probe:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
      - grow_data:/data
    environment:
      - DATA_DIR=/data
      - PROBE_EVERY=${PROBE_EVERY:-60}
      - REPORT_URL=${REPORT_URL:-}
    command: sh -c "exec python -u /app/probe.py"
    restart: on-failure:5

volumes:
  grow_data:
