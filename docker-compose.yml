services:
  bench:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
      - grow_data:/data
    environment:
      - SCRIPT=${SCRIPT:-}
      - RUN_BENCH=${RUN_BENCH:-0}
      - CKPT=${CKPT:-}
      - TAG=${TAG:-}
      - INIT=${INIT:-}
      - OUT=${OUT:-}
      - TRAIN_SECONDS=${TRAIN_SECONDS:-28800}
      - THREADS=${THREADS:-3}
      - TARGET_CHARS=${TARGET_CHARS:-40000000}
      - REPORT_EVERY=${REPORT_EVERY:-900}
      - CKPT_EVERY=${CKPT_EVERY:-600}
      - DATA_DIR=/data
      - REPORT_URL=${REPORT_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    # ⚠️ مايشتغلش لوحده على الـdeploy — لازم RUN_BENCH=1 صريح (حماية للإنتاج)
    command: sh -c "if [ \"$RUN_BENCH\" != \"1\" ] || [ -z \"$SCRIPT\" ]; then echo 'bench idle (set RUN_BENCH=1 and SCRIPT)'; sleep infinity; else pip install --no-cache-dir -q numpy torch --index-url https://download.pytorch.org/whl/cpu && exec python -u /app/$SCRIPT; fi"
    stop_grace_period: 90s
    restart: "no"

  factory:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
      - grow_data:/data
    environment:
      - FACTORY_SCRIPT=${FACTORY_SCRIPT:-}
      - RUN_FACTORY=${RUN_FACTORY:-0}
      - TEACHER_BASE_URL=${TEACHER_BASE_URL:-https://aihubmix.com/v1}
      - TEACHER_API_KEY=${TEACHER_API_KEY:-}
      - TEACHER_MODEL=${TEACHER_MODEL:-qwen3.8-flash}
      - TEACHER_MAX_TOKENS=${TEACHER_MAX_TOKENS:-1400}
      - MAX_CALLS=${MAX_CALLS:-500}
      - FACTORY_SECONDS=${FACTORY_SECONDS:-7200}
      - REPORT_EVERY=${REPORT_EVERY:-600}
      - DATA_DIR=/data
      - REPORT_URL=${REPORT_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    command: sh -c "if [ \"$RUN_FACTORY\" != \"1\" ] || [ -z \"$FACTORY_SCRIPT\" ]; then echo 'factory idle (set RUN_FACTORY=1 and FACTORY_SCRIPT)'; sleep infinity; else exec python -u /app/$FACTORY_SCRIPT; fi"
    stop_grace_period: 60s
    restart: "no"

  # خدمة الموديل (llama-server) — بتبقى شغالة باستمرار لما RUN_LLM=1
  llm:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
      - grow_data:/data
    environment:
      - RUN_LLM=${RUN_LLM:-0}
      - LLM_API_KEY=${LLM_API_KEY:-orcanox-local-key}
      - LLM_MODEL=${LLM_MODEL:-/data/moe/exp4.gguf}
    ports:
      - "8090:8080"
    command: sh -c "if [ \"${RUN_LLM:-0}\" = \"0\" ]; then echo 'llm idle'; sleep infinity; else sed 's/\r$//' /app/serve_llm.sh > /tmp/l.sh; sh /tmp/l.sh; fi"
    restart: unless-stopped

  moebench:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
      - grow_data:/data
    environment:
      - RUN_MOEBENCH=${RUN_MOEBENCH:-0}
    # ⚠️ مايشتغلش لوحده على الـdeploy — لازم RUN_MOEBENCH=1 صريح
    command: sh -c "if [ \"$RUN_MOEBENCH\" != \"1\" ]; then echo 'moebench idle'; sleep infinity; else sed 's/\r$//' /app/moe_bench_server.sh > /tmp/s.sh; sh /tmp/s.sh; echo 'خلص — الكونتينر هيقف'; sleep 600; fi"
    restart: "no"

  sysinfo:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
      - grow_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - RUN_SYSINFO=${RUN_SYSINFO:-0}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - AUDIT_REPO=${AUDIT_REPO:-Nabilkarem911/orcanox-internal}
    # ⚠️ مايشتغلش لوحده على الـdeploy — لازم RUN_SYSINFO=1 صريح
    command: sh -c "if [ \"${RUN_SYSINFO:-0}\" = \"0\" ]; then echo 'sysinfo idle'; sleep infinity; else sh /app/sysinfo.sh; sh /app/needle_test.sh; echo 'خلص'; sleep 1800; fi"
    restart: "no"

  cpubench:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
      - grow_data:/data
    environment:
      - BENCH_MODEL=${BENCH_MODEL:-Qwen/Qwen2.5-0.5B}
      - THREADS=${THREADS:-4}
      - RUN_CPUBENCH=${RUN_CPUBENCH:-0}
      - RESULTS_DIR=/data/results
      - REPORT_URL=${REPORT_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    command: sh -c "if [ \"$RUN_CPUBENCH\" != \"1\" ]; then echo 'cpubench idle (set RUN_CPUBENCH=1)'; sleep infinity; else sh /app/llama_bench_server.sh; echo 'خلص — الكونتينر هيفضل صاحي للمراجعة'; sleep 300; fi"
    stop_grace_period: 60s
    restart: "no"

  probe:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
      - grow_data:/data
    environment:
      - DATA_DIR=/data
      - PROBE_EVERY=${PROBE_EVERY:-60}
      - REPORT_URL=${REPORT_URL:-}
    command: sh -c "exec python -u /app/probe.py"
    restart: on-failure:3

  uploader:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
      - grow_data:/data
    environment:
      - DATA_DIR=/data
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_REPO=${GITHUB_REPO:-Nabilkarem911/grow-bench}
      - GITHUB_BRANCH=${GITHUB_BRANCH:-main}
      - PUSH_EVERY=${PUSH_EVERY:-120}
      - PUSH_MAX_SECONDS=${PUSH_MAX_SECONDS:-10800}
      - REPORT_URL=${REPORT_URL:-}
    command: sh -c "exec python -u /app/push.py"
    restart: "no"

  # خدمة التمثيل متعددة اللغات (BAAI/bge-m3 · 1024 بُعد) — تخدم تيتان وأي مشروع تاني
  embedsrv:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
      - grow_data:/data
    environment:
      - RUN_EMBED=${RUN_EMBED:-0}
      - EMBED_MODEL=${EMBED_MODEL:-/data/moe/bge-m3-f16.gguf}
    networks:
      - default
      - embeds
    ports:
      - "8095:8080"
    command: sh -c "if [ \"${RUN_EMBED:-0}\" = \"0\" ]; then echo 'embedsrv idle'; sleep infinity; else sed 's/\r$//' /app/serve_embed.sh > /tmp/e.sh; sh /tmp/e.sh; fi"
    restart: unless-stopped

volumes:
  grow_data:

networks:
  embeds:
    external: true
    name: embeds
